name: Build and Push Candidate Docker Images

# Builds both images natively per architecture (no emulation), pushes each by
# digest, then joins them into multi-arch candidate tags:
#   localdev -> ghcr.io/fhir/ig-publisher-localdev and hl7fhir/ig-publisher-base
#   ci       -> ghcr.io/fhir/ig-build (copied to the production registry by
#               hand; GitHub holds no credentials for it, see k8s/dev-setup.md)
# Promote a tested localdev candidate with promote-localdev.yaml.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to build'
        default: 'master'
        required: true
  push:
    branches:
      - master
    paths:
      - 'images/ig-publisher/**'

env:
  GHCR_IMAGE: ghcr.io/fhir/ig-publisher-localdev
  DOCKERHUB_IMAGE: docker.io/hl7fhir/ig-publisher-base
  GHCR_CI_IMAGE: ghcr.io/fhir/ig-build

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    outputs:
      candidate_tag: ${{ steps.tag.outputs.candidate_tag }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.ref || github.ref }}

    - name: Set candidate tag
      id: tag
      run: echo "candidate_tag=candidate-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Log in to Docker Hub
      uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push by digest
      run: |
        set -euo pipefail
        push() {  # target, comma-separated image names
          docker buildx build \
            --platform linux/${{ matrix.arch }} \
            --target "$1" \
            --metadata-file "$RUNNER_TEMP/meta-$1.json" \
            --output "type=image,\"name=$2\",push-by-digest=true,name-canonical=true,push=true" \
            images/ig-publisher
          digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/meta-$1.json")
          echo "pushed $1 linux/${{ matrix.arch }} as $digest"
          mkdir -p "$RUNNER_TEMP/digests/$1" && touch "$RUNNER_TEMP/digests/$1/${digest#sha256:}"
        }
        push localdev "${GHCR_IMAGE},${DOCKERHUB_IMAGE}"
        push ci "${GHCR_CI_IMAGE}"

    - name: Save digest
      uses: actions/upload-artifact@v4
      with:
        name: digest-${{ matrix.arch }}
        path: ${{ runner.temp }}/digests/
        if-no-files-found: error
        retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    env:
      CANDIDATE_TAG: ${{ needs.build.outputs.candidate_tag }}
    steps:
    - name: Collect digests
      uses: actions/download-artifact@v4
      with:
        pattern: digest-*
        merge-multiple: true
        path: ${{ runner.temp }}/digests

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Log in to Docker Hub
      uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Create multi-arch candidate tags
      working-directory: ${{ runner.temp }}/digests
      run: |
        set -euo pipefail
        tag() {  # target dir, image
          sources=()
          for d in "$1"/*; do sources+=("${2}@sha256:${d##*/}"); done
          docker buildx imagetools create -t "${2}:${CANDIDATE_TAG}" "${sources[@]}"
          docker buildx imagetools inspect "${2}:${CANDIDATE_TAG}"
        }
        tag localdev "$GHCR_IMAGE"
        tag localdev "$DOCKERHUB_IMAGE"
        tag ci "$GHCR_CI_IMAGE"
