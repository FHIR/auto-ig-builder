apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-build-deployment
  namespace: fhir
spec:
  replicas: 1
  selector:
    matchLabels:
      run: ci-build
  template:
    metadata:
      labels:
        run: ci-build
      namespace: fhir
    spec:
      # sshd and supervisord need root and its capabilities, so these
      # containers keep them; this only filters syscalls and stops setuid gains.
      # The web server must not land on the spot build pool (preempted ~20x a
      # day there); build-fhir-org is its dedicated on-demand pool.
      nodeSelector:
        cloud.google.com/gke-nodepool: build-fhir-org
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - env:
        - name: BUILD_NUMBER
          value: "1"
        - name: AUTOCLEAN_EXEMPTION_REGEX
          value: ./\(HL7\|FHIR\|IHE\|CodeX-HL7-FHIR-Accelerator\|argonautproject\)/[^/]*/branches/\(main\|master\)
        - name: SSH_AUTHORIZED_KEY
          valueFrom:
            configMapKeyRef:
              key: ssh_authorized_key
              name: ci-build-config
        image: gcr.io/fhir-org-starter-project/ci-build
        imagePullPolicy: Always
        name: ci-build
        securityContext:
          allowPrivilegeEscalation: false
        volumeMounts:
        - mountPath: /home/fhir_upload/uploading
          name: fhir-ci-build-disk
      - image: gcr.io/fhir-org-starter-project/caddy-ratelimit:latest
        name: caddy
        securityContext:
          allowPrivilegeEscalation: false
        volumeMounts:
        - name: fhir-ci-build-disk
          mountPath: /var/www
          subPath: www
        - name: ig-index-volume
          mountPath: /opt/ig-index
          readOnly: true
        - name: caddy-cert-disk
          mountPath: /data
        - name: caddy-conf-volume
          mountPath: /etc/caddy/Caddyfile
          subPath: Caddyfile
      initContainers:
      - command:
        - sh
        - -c
        - mkdir -p /disk/www && chmod a+rwx /disk /disk/www
        image: busybox:1.37.0
        imagePullPolicy: IfNotPresent
        name: permissions
        volumeMounts:
        - mountPath: /disk
          name: fhir-ci-build-disk
      restartPolicy: Always
      terminationGracePeriodSeconds: 10
      volumes:
      - gcePersistentDisk:
          fsType: ext4
          pdName: caddy-cert-disk
        name: caddy-cert-disk
      - gcePersistentDisk:
          fsType: ext4
          pdName: fhir-ci-build-disk
        name: fhir-ci-build-disk
      - configMap:
          defaultMode: 420
          name: caddy-conf-volume
        name: caddy-conf-volume
      - configMap:
          defaultMode: 420
          name: ig-index-volume
        name: ig-index-volume
